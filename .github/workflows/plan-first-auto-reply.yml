# Plan-first auto-reply
#
# Rule (maintainer's decision): a bare "assign me" never wins an issue — the
# contributor must share a detailed plan first. This workflow enforces that
# without the maintainer having to reply by hand.
#
# When someone posts a SHORT claim comment on an unassigned issue (e.g.
# "please assign me this issue") with no sign of a plan in it, the workflow
# replies asking for the plan. It does NOT assign anyone.
#
# Guards against noise:
# - issues only (not PRs), bot and maintainer comments ignored;
# - only when the issue is currently unassigned;
# - only short comments (< 250 chars) with claim language and NO plan
#   keywords (plan, approach, implement, files, steps, test, ...);
# - never replies twice on the same issue (checks for an earlier
#   plan-request comment first).

name: Plan-first auto-reply

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  ask-for-plan:
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && github.event.comment.user.login != 'tanveer-arch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const body = (comment.body || '').toLowerCase();

            if ((issue.assignees || []).length > 0) {
              core.info('Issue already assigned — no reply.');
              return;
            }

            const claimPhrases = [
              'assign',
              'work on',
              'take this',
              'take up',
              'i would like',
              'i want to',
              'claim',
              'interested',
              'please give',
              'give me',
            ];
            if (!claimPhrases.some(p => body.includes(p))) {
              core.info('Not a claim — no reply.');
              return;
            }

            // A real plan is long and uses plan language; bare claims are not.
            const planKeywords = [
              'plan',
              'approach',
              'implement',
              'files',
              'steps',
              'test case',
              'proposed',
              'solution',
            ];
            if (
              comment.body.length >= 250 ||
              planKeywords.some(p => body.includes(p))
            ) {
              core.info('Comment looks like a plan already — no reply.');
              return;
            }

            // Never ask twice on the same issue.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              }
            );
            if (
              comments.some(c =>
                (c.body || '').includes('share a brief technical plan')
              )
            ) {
              core.info('Plan already requested on this issue — no reply.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                `Hi @${comment.user.login} — thanks for offering! Before assigning, please share a brief technical plan here: ` +
                `which files you will modify, how you plan to implement this, and what test cases you plan to add. ` +
                `Once the plan looks good I'll assign it.`,
            });
            core.info(`Asked @${comment.user.login} for a plan on #${issue.number}.`);
