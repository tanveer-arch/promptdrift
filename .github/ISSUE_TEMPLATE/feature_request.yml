name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe what you'd like and why.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this feature solve? What are you trying to do?
      placeholder: I want to test my prompts for...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
      placeholder: A new assertion type that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you tried or considered?

  - type: dropdown
    id: area
    attributes:
      label: Component
      description: Which part of PromptDrift does this relate to?
      options:
        - CLI
        - Assertions / Evaluators
        - Providers
        - GitHub Action
        - Configuration
        - Reports
        - Documentation
        - Other
    validations:
      required: true
